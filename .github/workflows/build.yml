name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      
      - name: Create Android folder if missing
        run: |
          flutter pub get
          flutter create . --platforms=android --project-name salaama_muslim_jr_sch --org com.salaama.school || true
          flutter pub get
          
      - name: Generate App Icon from Logo
        run: flutter pub run flutter_launcher_icons || echo "Icon generated but manifest missing - continuing"

      - name: Build APK
        run: flutter build apk --release
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
